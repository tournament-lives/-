<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Pro | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { background: #050505; font-family: 'Orbitron', sans-serif; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 20px rgba(255, 65, 108, 0.3); }
        .animate-fade { animation: fadeIn 1s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex items-center justify-center h-screen text-white">

    <div class="glass p-8 rounded-3xl w-96 animate-fade glow">
        <h2 class="text-3xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500">SIGN IN</h2>
        
        <div class="space-y-4">
            <input type="number" id="phone" placeholder="Phone Number" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none focus:border-pink-500 transition">
            
            <div class="relative">
                <input type="password" id="password" placeholder="Password" class="w-full bg-white/5 p-3 rounded-xl border border-white/10 outline-none focus:border-pink-500 transition">
                <span id="togglePass" class="absolute right-4 top-3.5 cursor-pointer text-xs text-gray-400">SHOW</span>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="remember" class="accent-pink-500"> Remember Me
                </label>
            </div>

            <button onclick="handleLogin()" class="w-full py-3 bg-gradient-to-r from-pink-600 to-violet-600 rounded-xl font-bold hover:scale-105 transition-transform">LOGIN NOW</button>
        </div>
        
        <p class="mt-6 text-center text-xs text-gray-500">New player? <a href="pre_registration.html" class="text-pink-400 hover:underline">Register Tournament</a></p>
    </div>

    <script>
        // Password Toggle
        const togglePass = document.getElementById('togglePass');
        const passInput = document.getElementById('password');
        togglePass.addEventListener('click', () => {
            const type = passInput.type === 'password' ? 'text' : 'password';
            passInput.type = type;
            togglePass.textContent = type === 'password' ? 'SHOW' : 'HIDE';
        });

        // Remember Me Logic
        window.onload = () => {
            if(localStorage.getItem('phone')) {
                document.getElementById('phone').value = localStorage.getItem('phone');
                document.getElementById('password').value = localStorage.getItem('password');
                document.getElementById('remember').checked = true;
            }
        };

        function handleLogin() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if(remember) {
                localStorage.setItem('phone', phone);
                localStorage.setItem('password', password);
            } else {
                localStorage.removeItem('phone');
                localStorage.removeItem('password');
            }
            alert("Login System Active! Redirecting to Home...");
            // window.location.href = "home.html";
        }
    </script>
</body>
</html>
