<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        body { 
            background: radial-gradient(circle, #1a0b2e 0%, #050505 100%); 
            font-family: 'Orbitron', sans-serif; 
            color: white; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .glow-text { text-shadow: 0 0 20px #ff416c, 0 0 40px #ff416c; }
        .card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="p-6">

    <div class="card p-10 rounded-3xl text-center max-w-md w-full animate-float">
        <!-- Coming Soon Icon -->
        <div class="text-6xl mb-6">🚀</div>
        
        <h1 class="text-4xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-violet-500 glow-text">
            COMING SOON
        </h1>
        
        <p class="text-gray-400 mb-8 text-sm">
            We are working hard to build something amazing. Stay tuned for the big launch of our main website!
        </p>

        <!-- Back Button -->
        <a href="home.html" class="inline-block px-8 py-3 bg-white text-black font-bold rounded-xl hover:bg-pink-500 hover:text-white transition duration-300">
            GO BACK HOME
        </a>
    </div>

    <!-- Background Decoration -->
    <div class="absolute top-10 left-10 w-20 h-20 bg-pink-500 rounded-full blur-3xl opacity-20"></div>
    <div class="absolute bottom-10 right-10 w-40 h-40 bg-violet-500 rounded-full blur-3xl opacity-20"></div>

</body>
</html>
