<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Registration | Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body { background: #050505; font-family: 'Orbitron', sans-serif; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-style { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); outline: none; transition: 0.3s; }
        .input-style:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        /* Animation CSS */
        #success-animation { display: none; }
        @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: scaleIn 0.5s ease-out; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="reg-form" class="max-w-xl mx-auto glass p-8 rounded-3xl">
        <h2 class="text-2xl font-bold text-center mb-6 text-purple-400">PRE-REGISTRATION</h2>
        
        <div class="space-y-4">
            <input type="text" id="fullname" placeholder="Full Name" class="w-full p-3 rounded-xl input-style">
            <input type="text" id="uid" placeholder="Game UID" class="w-full p-3 rounded-xl input-style">
            <input type="text" id="gameName" placeholder="Game Name" class="w-full p-3 rounded-xl input-style">
            <input type="email" id="email" placeholder="Gmail Address" class="w-full p-3 rounded-xl input-style">
            <input type="tel" id="phone" placeholder="Phone Number" class="w-full p-3 rounded-xl input-style">
            <input type="password" id="password" placeholder="Set Password" class="w-full p-3 rounded-xl input-style">
            
            <button onclick="registerUser()" class="w-full py-4 bg-purple-600 rounded-xl font-bold hover:bg-purple-700 transition shadow-lg shadow-purple-500/30">COMPLETE REGISTRATION</button>
        </div>
    </div>

    <!-- Success Message Section -->
    <div id="success-animation" class="max-w-xl mx-auto glass p-12 rounded-3xl text-center animate-pop">
        <div class="text-6xl mb-4 text-green-400">✔</div>
        <h2 class="text-2xl font-bold">Registration Successful!</h2>
        <p class="text-gray-400 mt-2">Welcome to our tournament. Redirecting to your dashboard...</p>
    </div>

    <script>
        function registerUser() {
            // ডাটা ভ্যালিডেশন
            const name = document.getElementById('fullname').value;
            if(name === "") { alert("Please fill all details"); return; }

            // সাকসেস এনিমেশন দেখানোর কোড
            document.getElementById('reg-form').style.display = 'none';
            document.getElementById('success-animation').style.display = 'block';

            // Firebase-এ ডাটা সেভ করার ফাংশন এখানে হবে...

            // ৩ সেকেন্ড পর হোম পেজে রিডাইরেক্ট
            setTimeout(() => {
                window.location.href = "home.html";
            }, 3000);
        }
    </script>
</body>
</html>
